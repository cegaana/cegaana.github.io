<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEGAANA | Events</title>
    <meta name="description"
        content="Upcoming events for College of Engineering, Guindy Alumni Association of North America.">
    <!-- Open Graph Tags for sharing -->
    <meta property="og:title" content="CEGAANA Events" id="og-title">
    <meta property="og:description" content="Join upcoming panels, webinars, and hikes with CEG alumni." id="og-desc">
    <meta property="og:image" content="https://cegaana.github.io/cegaana_logo.jpg" id="og-image">
    <meta property="og:url" content="https://cegaana.github.io/events/" id="og-url">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" crossorigin href="/assets/styles-B4fQrhEg.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DGHKYLW1CN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DGHKYLW1CN');
    </script>
</head>

<body>
    <header>
        <h1><a href="../index.html"><img src="/cegaana_logo.jpg" alt="CEGAANA Logo" class="header-logo"></a></h1>
    </header>

    <div class="container">
        <!-- <h2 class="section-title">All Events</h2> -->

        <div class="toggle-switch-container">
            <span class="toggle-label" id="label-cards">Cards</span>
            <label class="switch">
                <input type="checkbox" id="view-toggle-checkbox" checked>
                <span class="slider round"></span>
            </label>
            <span class="toggle-label active" id="label-flyer">Flyer</span>
        </div>

        <div class="grid" id="all-events-list">
            <!-- Events will be populated here by JavaScript -->
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="../index.html" class="btn">Back to Home</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 College of Engineering, Guindy Alumni Association of North America (CEGAANA).
            All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let allEvents = [];
            let currentView = 'flyer';
            
            const eventsGrid = document.getElementById('all-events-list');
            const toggleCheckbox = document.getElementById('view-toggle-checkbox');
            const labelCards = document.getElementById('label-cards');
            const labelFlyer = document.getElementById('label-flyer');

            toggleCheckbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    currentView = 'flyer';
                    labelFlyer.classList.add('active');
                    labelCards.classList.remove('active');
                } else {
                    currentView = 'cards';
                    labelCards.classList.add('active');
                    labelFlyer.classList.remove('active');
                }
                renderEvents();
            });

            function formatEventDate(dateStr, options) {
                if (typeof dateStr === 'string' && dateStr.includes('T')) {
                    const [year, month, day] = dateStr.split('T')[0].split('-').map(Number);
                    return new Date(year, month - 1, day).toLocaleDateString(undefined, options);
                }
                return new Date(dateStr).toLocaleDateString(undefined, options);
            }

            function renderEvents() {
                eventsGrid.innerHTML = '';
                if (allEvents && allEvents.length > 0) {
                    allEvents.forEach((event, index) => {
                        const dateStr = formatEventDate(event.date, { 
                            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                        });
                        
                        const timeStr = event.timeLabel ? event.timeLabel : new Date(event.date).toLocaleTimeString(undefined, {
                            hour: '2-digit', minute: '2-digit'
                        });

                        const card = document.createElement('div');
                        card.id = `event-${event.id}`;
                        const isCompleted = new Date(event.date) < new Date();
                        const themeClass = event.category ? `theme-${event.category}` : 'theme-default';
                        
                        const shareIconHTML = `
                            <button onclick="copyEventLink(event, '${event.id}', '${event.title.replace(/'/g, "\\'")}')" title="Copy Link to Share" style="position: absolute; top: 15px; right: 15px; background: none; border: none; cursor: pointer; color: inherit; opacity: 0.5; transition: opacity 0.2s; z-index: 2;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="18" cy="5" r="3"></circle>
                                    <circle cx="6" cy="12" r="3"></circle>
                                    <circle cx="18" cy="19" r="3"></circle>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                </svg>
                            </button>
                        `;

                        if (isCompleted) {
                            let panelistsText = '';
                            if (event.panelists && event.panelists.length > 0) {
                                const names = event.panelists.map(p => p.name).join(', ');
                                panelistsText = `<p style="margin: 5px 0; font-size: 0.9em; color: #666;">🎙 <strong>Panelists:</strong> ${names}</p>`;
                            }

                            card.className = `card ${themeClass}`;
                            card.style.opacity = '0.7';
                            card.style.position = 'relative';
                            card.innerHTML = `
                                ${shareIconHTML}
                                <h4 style="margin-bottom: 10px; color: #555;">${event.title} <span style="font-size: 0.8em; font-weight: normal;">(Completed)</span></h4>
                                <p style="margin: 5px 0; font-size: 0.9em; color: #666;">📅 <strong>Date:</strong> ${dateStr}</p>
                                ${panelistsText}
                            `;
                            card.style.display = 'flex';
                            card.style.flexDirection = 'column';
                        } else if (currentView === 'cards') {
                            let panelistsHTML = '';
                            if (event.panelists && event.panelists.length > 0) {
                                const links = event.panelists.map(p => `<a href="${p.url}" target="_blank" rel="noopener noreferrer">${p.name}</a>`).join(', ');
                                panelistsHTML = `<p style="margin: 5px 0;">🎙 <strong>Panelists:</strong> ${links}</p>`;
                            }

                            const cardTint = (index % 4) + 1;
                            card.className = `card card-tint-${cardTint} ${themeClass}`;
                            card.style.backgroundColor = 'var(--theme-simple-bg, #ffffff)';
                            card.style.position = 'relative';
                            
                            const joinBtnHTML = event.url
                                ? `<a href="${event.url}" class="btn" target="_blank" rel="noopener noreferrer" style="margin-top: auto; background-color: var(--theme-simple-btn, var(--primary-color));">🔗 Join Event</a>`
                                : `<button class="btn" disabled style="margin-top: auto; opacity: 0.65; cursor: not-allowed; border: none; font-family: inherit; font-size: inherit; background-color: var(--theme-simple-btn, var(--primary-color));">Coming Soon</button>`;

                            card.innerHTML = `
                                ${shareIconHTML}
                                <h4 style="margin-bottom: 10px; padding-right: 25px;">${event.title}</h4>
                                <div style="font-size: 0.95em; color: #444; margin-bottom: 15px;">
                                    <p style="margin: 5px 0;">📅 <strong>Date:</strong> ${dateStr}</p>
                                    <p style="margin: 5px 0;">⏰ <strong>Time:</strong> ${timeStr}</p>
                                    <p style="margin: 5px 0;">📍 <strong>Mode:</strong> ${event.location}</p>
                                    ${panelistsHTML}
                                </div>
                                <p style="margin-bottom: 20px;">${event.description}</p>
                                ${joinBtnHTML}
                            `;
                            card.style.display = 'flex';
                            card.style.flexDirection = 'column';
                        } else {
                            let panelistsNamesHTML = '';
                            if (event.panelists && event.panelists.length > 0) {
                                panelistsNamesHTML = event.panelists.map(p => `<p class="card-rich-names"><a href="${p.url}" target="_blank" rel="noopener noreferrer">${p.name}</a></p>`).join('');
                                panelistsNamesHTML = `<div class="card-rich-section-title" style="margin-top: 10px;">FEATURED PANELISTS</div>${panelistsNamesHTML}`;
                            }
                            
                            // Highlight format: Split title on colon if present, or just highlight the last word
                            let formattedTitle = event.title;
                            if (formattedTitle.includes(':')) {
                                formattedTitle = formattedTitle.replace(':', '<br><span class="card-rich-highlight">') + '</span>';
                            } else {
                                const words = formattedTitle.split(' ');
                                if (words.length > 1) {
                                    const last = words.pop();
                                    formattedTitle = words.join(' ') + ` <span class="card-rich-highlight">${last}</span>`;
                                }
                            }

                            const joinBtnHTML = event.url
                                ? `<a href="${event.url}" class="card-rich-btn" target="_blank" rel="noopener noreferrer">JOIN EVENT</a>`
                                : `<button class="card-rich-btn" disabled style="opacity: 0.65; cursor: not-allowed; border: none; font-family: inherit;">Coming Soon</button>`;

                            card.className = `card-rich ${themeClass}`;
                            card.innerHTML = `
                                ${shareIconHTML}
                                <div class="card-rich-grid"></div>
                                <div class="card-rich-header">
                                    <img src="../cegaana-square-logo.jpg" class="card-rich-logo" alt="CEGAANA">
                                    <div class="card-rich-org">CEGAANA PRESENTS</div>
                                </div>
                                <h1 class="card-rich-title">${formattedTitle.toUpperCase()}</h1>
                                <div class="card-rich-info-box">
                                    <p class="card-rich-info-text">${dateStr.toUpperCase()} &bull; ${timeStr.toUpperCase()}</p>
                                    <p class="card-rich-info-sub">📍 LIVE ON ${event.location.toUpperCase()}</p>
                                </div>
                                ${panelistsNamesHTML}
                                <div class="card-rich-topics">${event.description}</div>
                                ${joinBtnHTML}
                            `;
                        }
                        
                        eventsGrid.appendChild(card);
                    });

                    // Scroll to hash if present on load
                    if (window.location.hash) {
                        setTimeout(() => {
                            const el = document.getElementById(window.location.hash.substring(1));
                            if (el) el.scrollIntoView({ behavior: 'smooth' });
                            
                            // Update OG tags dynamically if single event link
                            const eventId = window.location.hash.substring(1).replace('event-', '');
                            const evt = allEvents.find(e => e.id == eventId);
                            if (evt) {
                                document.getElementById('og-title').content = evt.title;
                                document.getElementById('og-desc').content = evt.description;
                            }
                        }, 500);
                    }
                } else {
                    eventsGrid.innerHTML = '<p>No upcoming events at this time.</p>';
                }
            }

            fetch('./events_list.json')
                .then(response => response.json())
                .then(events => {
                    allEvents = events;
                    renderEvents();
                })
                .catch(error => {
                    console.error('Error fetching events:', error);
                    document.getElementById('all-events-list').innerHTML = '<p>Error loading events. Please try again later.</p>';
                });
        });

        function getShareUrl(id) {
            const loc = window.location;
            let basePath = loc.pathname;
            if (basePath.endsWith('.html')) {
                basePath = basePath.substring(0, basePath.lastIndexOf('/'));
            }
            if (!basePath.endsWith('/')) {
                basePath += '/';
            }
            return loc.origin + basePath + `event-${id}.html`;
        }

        // Global copy function
        window.copyEventLink = function copyEventLink(e, id, title) {
            e.preventDefault();
            e.stopPropagation();
            
            const shareUrl = getShareUrl(id);
            const btn = e.currentTarget;
            const originalHTML = btn.innerHTML;

            const showSuccess = () => {
                btn.innerHTML = '<span style="font-size:12px; font-weight:bold;">Copied!</span>';
                setTimeout(() => btn.innerHTML = originalHTML, 2000);
            };
            
            // Prefer native OS share if supported (works on macOS Safari, iOS, Android, etc.)
            if (navigator.share) {
                navigator.share({
                    title: title,
                    url: shareUrl
                }).catch(console.error);
            } else if (navigator.clipboard && window.isSecureContext) {
                // Modern clipboard API (works in modern Safari over HTTPS/localhost)
                navigator.clipboard.writeText(shareUrl).then(showSuccess).catch(err => {
                    console.error('Clipboard copy failed, using fallback', err);
                    fallbackCopy(shareUrl, showSuccess);
                });
            } else {
                // Legacy fallback for older Safari or non-secure contexts
                fallbackCopy(shareUrl, showSuccess);
            }
        }

        function fallbackCopy(text, onSuccess) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            // Prevent scrolling
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                if (onSuccess) onSuccess();
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>

</html>
